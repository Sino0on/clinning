services:
  web:
    build: .
    image: clinning-web
    # 2 воркера: пока один принимает большую загрузку из админки, второй
    # отвечает сайту. timeout 120 — запас на загрузку видео до 300 МБ.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8111 --workers 2 --timeout 120
    volumes:
      - .:/app
    ports:
      - "8111:8111"
    env_file:
      - .env
    depends_on:
      - db

  # Telegram-бот для отзывов (content/management/commands/run_telegram_bot.py).
  # Тот же образ, что у web. Без TELEGRAM_BOT_TOKEN просто спит.
  bot:
    image: clinning-web
    pull_policy: never
    command: python manage.py run_telegram_bot
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: clinning
      POSTGRES_USER: clinning_user
      POSTGRES_PASSWORD: clinning_pass

volumes:
  postgres_data: